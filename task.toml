schema_version = "1.3"

[task]
name = "humanlaya/coding-task"
version = "2.1"        # G 多节点（edge/mesh 语义模拟 + 计数维度 + span 注入）        # 契约 v4.0-L3（C+E+F）：平台侧以此区分任务包缓存；stdout 首行 contract= 自证

[agent]
timeout_sec = 21600        # L3：C(断点续读)+E(性能)+F(跨层矩阵) 人类参考工时 4-6h

[environment]
timeout_sec = 25200        # 覆盖 agent 21600s + 验证余量
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 10240         # E 探针生成 1M 行压测日志（~110MB×2）

[verifier]
timeout_sec = 900          # L3 探针：1M 行压测 + strace + 轮转序列 + 18 格矩阵

[metadata]
difficulty = "hard"        # easy / medium / hard
category = "incident-coding"
tags = ["nginx", "http-431", "go", "operations", "observability", "logrotate", "performance"]
