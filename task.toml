schema_version = "1.3"

# 交付物清单（顶层，第一个表头之前）：验题后由平台收集。
# 路径与题面（期望结果 5）/solution/solve.sh 步骤⑦/tests/test.sh 各检查四处一致，
# 均为 /app/ops 下四产物（见 instruction.md"产物 schema"）。
# 注意：本任务验题（tests/test.sh）强依赖任务环境内部状态（nginx -T、/app 源码扫描、
# 日志截断+reopen、supervisorctl、warnings.log 实时观测），verifier 保持环境内运行
# （不加 environment_mode="separate"，不建独立 tests/Dockerfile）。
artifacts = [
  "/app/ops/header_limits.env",
  "/app/ops/warnings.log",
  "/app/ops/quality_gate.sh",
  "/app/ops/diagnosis_report.md",
]

[task]
name = "humanlaya/coding-task"
version = "1.0"

[agent]
timeout_sec = 1200         # agent 解题的时间限制（秒），难题建议 900-1200

[environment]
timeout_sec = 1500
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 10240

[verifier]
timeout_sec = 300

[metadata]
difficulty = "hard"        # easy / medium / hard
category = "incident-coding"
tags = ["nginx", "http-431", "go", "service-mesh", "kafka", "operations", "observability", "capacity-sizing"]
