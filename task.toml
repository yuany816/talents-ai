schema_version = "1.3"

[task]
name = "humanlaya/coding-task"
version = "1.1"        # 契约 v3.1（27bb98b）：版本自证探针；平台侧以此区分旧包缓存

[agent]
timeout_sec = 900          # agent 解题的时间限制（秒），难题建议 900-1200

[environment]
timeout_sec = 900
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 10240

[verifier]
timeout_sec = 300

[metadata]
difficulty = "hard"        # easy / medium / hard
category = "incident-coding"
tags = ["nginx", "http-431", "go", "operations", "observability"]
