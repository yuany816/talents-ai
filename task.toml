schema_version = "1.3"

# 独立判分（Harbor 0.23.0，3.8 节）：交付目录整体收集，判分环境按同一绝对路径还原。
# /app/ops/ 内含四产物（header_limits.env / warnings.log / quality_gate.sh /
# diagnosis_report.md）与 evidence/ 六个证据文件（nginx_T.txt、curl_entry.txt、
# curl_backend.txt、upper_boundary.txt、span_count.txt、kafka_audit.txt）——
# 判分环境不再发起实时探针，全部检查读取交付产物与证据文件（见 tests/test.sh）。
artifacts = ["/app/ops/"]

[task]
name = "humanlaya/coding-task"
version = "1.0"

[agent]
timeout_sec = 1200         # agent 解题的时间限制（秒），难题建议 900-1200

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 10240

[verifier]
environment_mode = "separate"   # 独立判分：Harbor 以 tests/ 为构建目录启动判分环境，执行 /tests/test.sh
timeout_sec = 300

[metadata]
difficulty = "hard"        # easy / medium / hard
category = "incident-coding"
tags = ["nginx", "http-431", "go", "service-mesh", "kafka", "operations", "observability", "capacity-sizing"]
