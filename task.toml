schema_version = "1.3"

# 独立判分（Harbor 0.23.0，3.8 节）：交付收集后判分环境按同一绝对路径还原。
# 主交付物 = header_limits.env（单文件即可获得 structure 阶段分，长期无输出的
# 降级口径）；完整交付目录 /app/ops/（四产物 + warnings.log + evidence/ 六证据，
# 由环境预置模板与 /app/collect_evidence.sh 脚手架支撑）作为可选加分项一并收集。
# 判分环境不发实时探针，全部检查读取交付产物（见 tests/test.sh）。
artifacts = [
  "/app/ops/",  # 交付目录整体收集（含四产物 + warnings.log + evidence/）；
                # 不可同时声明目录内的单文件，否则 Harbor 只保留首个声明、丢弃目录。
]

[task]
name = "humanlaya/coding-task"
version = "1.0"

[agent]
timeout_sec = 1200         # agent 解题的时间限制（秒），难题建议 900-1200

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 4096
storage_mb = 10240

[verifier]
environment_mode = "separate"   # 独立判分：Harbor 以 tests/ 为构建目录启动判分环境，执行 /tests/test.sh
timeout_sec = 300

[metadata]
difficulty = "hard"        # easy / medium / hard
category = "incident-coding"
tags = ["nginx", "http-431", "go", "service-mesh", "kafka", "operations", "observability", "capacity-sizing"]
