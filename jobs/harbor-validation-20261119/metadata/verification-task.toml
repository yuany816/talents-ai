schema_version = "1.3"

# 共享判分：verifier 与作答环境同容器执行——行为探针直接对活服务做。
# 评分 = min(P1运维修复行为探针, F6实现题差分, F7实现题对抗)——短板定标。
# 交付文件仅作辅助（报告/取证脚本），修复与运行行为的判定全部来自探针。
# 代价：harbor lint 保留 1 条 shared-verifier 提示（已接受）。

[task]
name = "humanlaya/coding-task"
version = "1.0"

[agent]
timeout_sec = 1200         # agent 解题的时间限制（秒），难题建议 900-1200

[environment]
build_timeout_sec = 600
docker_image = "talents-ai-harbor-20261119:latest"
cpus = 1
memory_mb = 4096
storage_mb = 10240

[verifier]
timeout_sec = 300

[metadata]
difficulty = "hard"        # easy / medium / hard
category = "incident-coding"
tags = ["nginx", "http-431", "go", "service-mesh", "kafka", "operations", "observability", "capacity-sizing"]
