# 环境服务编排（由容器主进程 supervisord 加载）
# backend：Go 业务服务；nginx：入口反代。均 autorestart，意外退出自动拉起。
[program:backend]
command=/app/backend/backend
directory=/app/backend
priority=10
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/backend.log

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/nginx/supervisor_nginx.log
