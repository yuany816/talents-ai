# 环境服务编排（由容器主进程 supervisord 加载）
# 同步链路：nginx(入口:80) → tracegate(NG 插件:9100) → meshd(mesh sidecar:15001) → backend(业务:9000)
# 异步链路：backend → kafka(审计总线:9092) ← trace-collector(消费排空 → /var/log/trace_events.log)
# 全部 autorestart，意外退出自动拉起。
# priority 串行启动（kafka JVM 慢启留足 startsecs）：kafka → collector → backend → tracegate → meshd → nginx

[program:kafka]
command=/opt/kafka/start_kafka.sh
priority=5
startsecs=25
startretries=10
autorestart=true
stopwaitsecs=20
stopasgroup=true
killasgroup=true
environment=KAFKA_HEAP_OPTS="-Xmx512m -Xms256m"
redirect_stderr=true
stdout_logfile=/var/log/kafka.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2

[program:trace-collector]
command=/opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server 127.0.0.1:9092 --topic trace-events --group trace-collector --from-beginning --property print.headers=true
priority=6
startsecs=10
startretries=20
autorestart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=KAFKA_HEAP_OPTS="-Xmx192m -Xms64m"
redirect_stderr=true
stdout_logfile=/var/log/trace_events.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2

[program:backend]
command=/app/backend/backend
directory=/app/backend
priority=10
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/backend.log

[program:tracegate]
command=/app/tracegate/tracegate
directory=/app/tracegate
priority=12
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/tracegate.log

[program:meshd]
command=/app/mesh/meshd
directory=/app/mesh
; rollout v2417：控制面经部署环境下发的 header 上限运行时覆盖（优先于 sidecar.yaml；
; 生效语义见 meshd 启动日志 source 字段）。变更需 supervisorctl reread && update 后重启。
environment=MESH_HEADER_LIMIT="12288"
priority=14
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/meshd.log

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/nginx/supervisor_nginx.log
