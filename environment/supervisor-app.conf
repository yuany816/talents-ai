# 环境服务编排（由容器主进程 supervisord 加载）
# backend：Go 业务服务；nginx：入口反代；gate-shim：门禁 HTTP 预检包装（基础设施）。
# 均 autorestart，意外退出自动拉起。
[program:backend]
command=/app/backend/backend
directory=/app/backend
priority=10
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/backend.log

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
startsecs=2
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/var/log/nginx/supervisor_nginx.log

[program:gate-shim]
command=/usr/local/bin/gate-shim
priority=15
autorestart=true
startsecs=1
stopwaitsecs=3
redirect_stderr=true
stdout_logfile=/var/log/gate-shim.log

# 跨层矩阵节点：edge-sim（云 LB 语义，硬限制 400）→ mesh-sim（网格语义，可配置限额 + span 注入）→ nginx
[program:mesh-sim]
command=/usr/local/bin/mesh-sim
environment=MESH_SIM_CONFIG="/etc/mesh-sim/config.yaml"
priority=13
autorestart=true
startsecs=1
stopwaitsecs=3
redirect_stderr=true
stdout_logfile=/var/log/mesh-sim.log

[program:edge-sim]
command=/usr/local/bin/edge-sim
priority=16
autorestart=true
startsecs=1
stopwaitsecs=3
redirect_stderr=true
stdout_logfile=/var/log/edge-sim.log
