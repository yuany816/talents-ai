server {
    listen 80 default_server;
    server_name _;

    # 2025-11 容量评估时曾评估过 16k 方案，暂缓（观察 Trace header 增长趋势后再定）
    # large_client_header_buffers 8 16k;
    large_client_header_buffers 4 8k;

    # ---- L3 跨层矩阵路由 ----
    # /direct/：nginx 静态返回，不经后端、不经门禁（纯 nginx 层语义）
    location /direct/ {
        return 200 "ok\n";
    }
    # /via-backend/：经 nginx 转发到后端（Go 层语义可观测）
    location /via-backend/ {
        rewrite ^ /api/v1/profile break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }
    # /via-gate/：先过门禁预检（auth_request → gate-shim:9007），再转发后端；
    # 门禁不可用必须 fail-closed（error_page 归一为 503，绝不放行）
    location /via-gate/ {
        auth_request /gate-check;
        rewrite ^ /api/v1/profile break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        error_page 500 502 503 504 =503 /gate-down.html;
    }
    location = /gate-check {
        internal;
        proxy_pass http://127.0.0.1:9007/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 门禁不可用时的 fail-closed 错误页（error_page 归一目标）
    location = /gate-down.html {
        internal;
        return 503 "gate unavailable\n";
    }
}
